# Canonical operator copy. GitHub executes the required in-repository mirror.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: posse

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        # The root package intentionally does not publish a package-lock.json.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run portable focused tests
        run: |
          node --test test/test-posse-remote-composer.test.js
          node --test test/test-posse-remote-parity.test.js
          node --test test/test-agent-handoff.test.js
          node --test test/test-role-hook-contract.test.js
          node --test test/test-sub-agent-runtime.test.js
          node --test test/test-posse-local-provider.test.js
          # The reader-lane integration requires the sibling posse-bin debug
          # build and remains covered by the full operator publication suite.
          node --test --test-concurrency=1 test/test-atlas-native-jina-encoder.test.js test/test-embedding-resource-pool.test.js test/test-atlas-v2-readiness.test.js
          node --test test/core/suites/provider-aliases.test.js
          npm run test:scheduler:fast
